[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlfusion"
version = "2.4.1"
description = "Reproducible SDXL checkpoint merging toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "warc0s" }
]
keywords = [
  "sdxl",
  "stable-diffusion",
  "checkpoint-merging",
  "safetensors",
  "diffusion-models",
  "python",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0.0",
  "safetensors>=0.3.0",
  "PyYAML>=6.0",
  "numpy>=1.24.0",
  "tqdm>=4.65.0",
  "psutil>=5.9.0",
  "packaging>=21.0",
]

[project.scripts]
xlfusion = "xlfusion.app:main"
xlfusion-gui = "xlfusion.gui_app:main"

[project.urls]
Homepage = "https://github.com/warc0s/XLFusion"
Repository = "https://github.com/warc0s/XLFusion"
Issues = "https://github.com/warc0s/XLFusion/issues"
Changelog = "https://github.com/warc0s/XLFusion/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["xlfusion"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
