# XLFusion batch configuration example.
#
# This file is documentation only until you provide your own checkpoints.
# Place model files in workspace/models/ before validating or running:
# - base_model_a.safetensors
# - base_model_b.safetensors
# - base_model_c.safetensors
#
# Validate without merging:
# python XLFusion.py --batch batch_config_example.yaml --validate-only

global_settings:
  output_base: "batch_output"
  continue_on_error: true
  max_parallel: 1
  log_level: "INFO"

batch_jobs:
  - name: "classic_weighted_merge"
    mode: "legacy"
    description: "Traditional weighted merge with explicit backbone."
    models:
      - "base_model_a.safetensors"
      - "base_model_b.safetensors"
    weights: [0.60, 0.40]
    backbone: 0
    block_multipliers:
      - {down: 1.0, mid: 1.0, up: 1.0}
      - {down: 1.1, mid: 0.9, up: 1.0}
    crossattn_boosts:
      - {down: 1.0, mid: 1.0, up: 1.0}
      - {down: 1.0, mid: 1.1, up: 1.0}
    output_name: "ClassicWeightedMerge"
    only_unet: true

  - name: "detail_preserving_perres"
    mode: "perres"
    description: "Assign SDXL block groups to different source checkpoints."
    models:
      - "base_model_a.safetensors"
      - "base_model_b.safetensors"
    backbone: 0
    assignments:
      down_0_1: 0
      down_2_3: 0
      mid: 1
      up_0_1: 1
      up_2_3: 1
    attn2_locks:
      down: 0
      mid: 1
      up: 1
    output_name: "DetailPreservingPerRes"

  - name: "hybrid_style_transfer"
    mode: "hybrid"
    description: "Preserve composition in down blocks and apply style in up blocks."
    block_mapping: "sdxl"
    models:
      - "base_model_a.safetensors"
      - "base_model_b.safetensors"
    backbone: 0
    hybrid_config:
      down_0_1: {0: 0.80, 1: 0.20}
      down_2_3: {0: 0.70, 1: 0.30}
      mid: {0: 0.55, 1: 0.45}
      up_0_1: {0: 0.30, 1: 0.70}
      up_2_3: {0: 0.20, 1: 0.80}
    attn2_locks:
      down: 0
      mid: 0
      up: 1
    output_name: "HybridStyleTransfer"
    component_policy:
      vae: "backbone"
      text_encoder: "backbone"
      other: "backbone"

  - name: "template_based_style_transfer"
    template: "style_transfer"
    description: "Apply a reusable hybrid template with custom weights."
    models:
      - "base_model_a.safetensors"
      - "base_model_b.safetensors"
    template_params:
      primary_weight: 0.75
    output_name: "TemplateStyleTransfer"

templates:
  style_transfer:
    mode: "hybrid"
    description: "Transfer style while preserving content structure."
    default_params:
      primary_weight: 0.70
    config_template:
      backbone: 0
      hybrid_config:
        down_0_1: {0: "{{primary_weight}}", 1: "{{1 - primary_weight}}"}
        down_2_3: {0: "{{primary_weight}}", 1: "{{1 - primary_weight}}"}
        mid: {0: 0.50, 1: 0.50}
        up_0_1: {1: "{{primary_weight}}", 0: "{{1 - primary_weight}}"}
        up_2_3: {1: "{{primary_weight}}", 0: "{{1 - primary_weight}}"}
      attn2_locks:
        down: 0
        mid: 0
        up: 1
